name: รายงานบั๊ก
description: มาโครค้าง ทำงานผิด หรือแพ้แปลกๆ — แนบไฟล์รายงานให้ผู้พัฒนาแก้
title: "[บั๊ก] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ในหน้าต่างตั้งค่า กดปุ่ม **🐞 รายงานบั๊ก** (หรือกด **F9** ตอนมาโครเปิดอยู่) จะได้ไฟล์ `bug_report_....zip`
        แล้วลากไฟล์นั้นมาวางในช่อง "ไฟล์รายงาน" ด้านล่าง
  - type: textarea
    id: what
    attributes:
      label: เกิดอะไรขึ้น
      placeholder: เช่น ห้อง Depth 4 วางยูนิตช่อง 2 ซ้ำไม่หยุดจนแพ้
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: เกิดตอนไหน
      placeholder: เช่น Depth 4, Magic Town, เวฟ 5, หน้าร้านค้า
  - type: textarea
    id: files
    attributes:
      label: ไฟล์รายงาน (.zip) และภาพหน้าจอ
      description: ลากไฟล์ bug_report_....zip และภาพหน้าจอตอนที่ค้าง (ถ้ามี) มาวางที่นี่
    validations:
      required: true
